<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="VoiceBox - Speak up. See it through. A professional office feedback system: employees share named or anonymous feedback and track what happens to it, managers triage and act on it."
		/>
		<meta name="theme-color" content="#14213D" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<title>VoiceBox</title>
		<script>
			// Apply the saved theme before first paint (no flash of the wrong theme).
			try {
				var db = localStorage.getItem('voicebox.db.v1');
				var t = db ? JSON.parse(db).settings.theme : null;
				if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
			} catch (e) {}
		</script>
		<style>
			#boot-loader {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				background: #f7f8fa;
				color: #14213d;
				font: 500 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				z-index: 50;
			}
			html[data-theme='dark'] #boot-loader {
				background: #0f1420;
				color: #e7eaf0;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot-loader" data-testid="loading">Loading VoiceBox...</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
